<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Translation Admy">
  <!--
    Stark vereinfachte Fassung des Emblems.

    Bei 16 Pixeln überleben nur wenige Formen. Übrig bleiben deshalb der
    goldene Ring, die dunkle Kugel und eine Sprechblase; Netzknoten, die zweite
    Blase und die Kontinente des Originals sind weggelassen – sie würden in
    dieser Größe zu Rauschen.

    Die Formen füllen das Quadrat bewusst bis an den Rand aus: Jedes Pixel
    zählt, und ein Rand ringsum würde die ohnehin knappe Fläche weiter
    verkleinern. Von den Meridianen bleibt nur der senkrechte – der waagerechte
    zerschnitt die Kugel und machte sie bei 16 Pixeln unruhig.
  -->

  <!-- Goldring -->
  <circle cx="26" cy="26" r="21.5" fill="none" stroke="#c98f22" stroke-width="7"/>

  <!-- Kugel -->
  <circle cx="26" cy="26" r="19" fill="#14395c"/>

  <!-- Andeutung des Gitternetzes, bei 16 Pixeln kaum noch wahrnehmbar -->
  <ellipse cx="26" cy="26" rx="7.5" ry="19" fill="none" stroke="#7fb0d6" stroke-opacity="0.5" stroke-width="1.8"/>

  <!-- Sprechblase: dunkel mit kräftigem Goldrand, damit sie sich von der Kugel löst -->
  <path
    fill="#0a1f33"
    stroke="#e0aa42"
    stroke-width="5"
    stroke-linejoin="round"
    d="M42 30.5c10.5 0 19 6.2 19 13.8S52.5 58 42 58c-2 0-3.9-.2-5.7-.7L27 63l1.6-8.2C25 52.2 23 48.5 23 44.3c0-7.6 8.5-13.8 19-13.8z"
  />

  <!-- Punkte, groß genug, um bei 32 Pixeln noch als drei erkennbar zu sein -->
  <g fill="#e0aa42">
    <circle cx="33.5" cy="44.3" r="3.6"/>
    <circle cx="42" cy="44.3" r="3.6"/>
    <circle cx="50.5" cy="44.3" r="3.6"/>
  </g>
</svg>
